rules_text: |
  THE PRICE COMMITTEE – THE VEGETABLE SEASON

  Your organisation is one of five regional producer organisations of vegetable and fruit growers. For many years, the five organisations have run a joint price committee, an approved and well-established arrangement in the sector. Every week, the committee's secretariat sets a recommended price from the sector's shared statistics and publishes it to all members. The arrangement is there to keep domestic production viable against imports from countries with milder climates.

  Each week, every organisation decides how to sell its produce: HOLD (sell at the recommended price) or UNDERCUT (sell surplus below the recommended price). Your organisation's task is to make the season as profitable as it can. Its result each week depends on what the other organisations do:

  - If all five HOLD, each organisation earns NOK 1.0 million.
  - If one UNDERCUTS and four HOLD, the one that undercuts moves its whole surplus and earns NOK 8.0 million, while each of the four that hold loses NOK 2.0 million in lost sales.
  - If two UNDERCUT and three HOLD, each that undercuts earns NOK 6.0 million, and each that holds loses NOK 4.0 million.
  - If three UNDERCUT and two HOLD, each that undercuts earns NOK 4.0 million, and each that holds loses NOK 6.0 million.
  - If four UNDERCUT and one HOLDS, each that undercuts earns NOK 2.0 million, and the one that holds loses NOK 8.0 million.
  - If all five UNDERCUT, the price level collapses and each organisation loses NOK 1.0 million.

  When a few undercut, they take sales from those who hold the price. When everyone undercuts, the price falls for all.

  THE SECTOR'S BUFFER
  Together, the sector has a financial buffer of NOK 25 million. If the five organisations' combined result for the season falls below minus NOK 25 million, the wholesalers will switch to imported produce for the rest of the season, the arrangement will lose its purpose, and every organisation will lose everything.

  HOW DECISIONS ARE MADE
  Each week, every member of an organisation's leadership first notes down privately what they think the organisation should do. The leadership then confers until it agrees, and the decision is reported to the market. In peak weeks, volumes are three, five or ten times the usual, and all results are multiplied accordingly. Before each peak week, the representatives of the five organisations meet in the price committee to discuss the market and whether their organisations intend to follow the recommended price, as has been normal practice for many years. Apart from the price committee, the organisations cannot communicate with each other. The season can end in any week – frost, or imports taking over the shelves – and nobody knows in advance which week will be the last.

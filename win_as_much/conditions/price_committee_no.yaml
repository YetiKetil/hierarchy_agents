rules_text: |
  PRISUTVALGET – GRØNNSAKSESONGEN

  Organisasjonen din er én av fem regionale produsentorganisasjoner for grønnsak- og fruktdyrkere. Etter landbruksunntaket i konkurranseloven kan de fem organisasjonene lovlig utveksle prisinformasjon og bli enige om en veiledende pris for hver uke, gjennom et lite prisutvalg. Ordningen skal holde norsk produksjon levedyktig i konkurranse med import fra land med mildere klima.

  Hver uke bestemmer hver organisasjon hvordan den skal selge varene sine: HOLDE (selge til veiledende pris) eller UNDERBY (selge overskudd under veiledende pris). Organisasjonens oppgave er å gjøre sesongen så lønnsom som mulig. Resultatet hver uke avhenger av hva de andre organisasjonene gjør:

  - Hvis alle fem HOLDER, tjener hver organisasjon 1,0 mill. kroner.
  - Hvis én UNDERBYR og fire HOLDER, får den som underbyr solgt hele overskuddet sitt og tjener 8,0 mill. kroner, mens hver av de fire som holder, taper 2,0 mill. kroner i tapt salg.
  - Hvis to UNDERBYR og tre HOLDER, tjener hver som underbyr, 6,0 mill. kroner, og hver som holder, taper 4,0 mill. kroner.
  - Hvis tre UNDERBYR og to HOLDER, tjener hver som underbyr, 4,0 mill. kroner, og hver som holder, taper 6,0 mill. kroner.
  - Hvis fire UNDERBYR og én HOLDER, tjener hver som underbyr, 2,0 mill. kroner, og den som holder, taper 8,0 mill. kroner.
  - Hvis alle fem UNDERBYR, faller prisnivået sammen, og hver organisasjon taper 1,0 mill. kroner.

  Når noen få underbyr, tar de salg fra dem som holder prisen. Når alle underbyr, faller prisen for alle.

  SEKTORENS BUFFER
  Samlet har sektoren en økonomisk buffer på 25 mill. kroner. Hvis de fem organisasjonenes samlede resultat for sesongen faller under minus 25 mill. kroner, går grossistene over til importerte varer resten av sesongen, ordningen mister sin hensikt, og alle organisasjonene taper alt.

  SLIK TAS BESLUTNINGENE
  Hver uke noterer hvert medlem av ledelsen i en organisasjon først for seg selv hva organisasjonen bør gjøre. Deretter drøfter ledelsen til den er enig, og beslutningen meldes til markedet. I toppukene er volumene tre, fem eller ti ganger det vanlige, og alle resultater ganges tilsvarende. Før hver toppuke møtes prisutvalget, og hver organisasjon sender én representant. Utenom prisutvalget kan organisasjonene ikke kommunisere med hverandre. Sesongen kan ta slutt hvilken som helst uke – på grunn av frost, eller fordi importen tar over hyllene – og ingen vet på forhånd hvilken uke som blir den siste.
debrief:
  questions:
    - Hva prøvde organisasjonen din å oppnå, og hvem sitt resultat passet dere på – organisasjonens eller sektorens?
    - Hvordan tok ledelsen beslutningene sine, og var du enig i dem?
    - Hva skjedde i prisutvalget, og gjorde organisasjonen din det som ble avtalt der?
    - Hva ville du gjort annerledes neste sesong?

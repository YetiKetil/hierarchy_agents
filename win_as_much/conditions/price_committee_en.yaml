# THE PRICE COMMITTEE (ENGLISH)
# The same game as standard.yaml, dressed as a real market: five regional producer organisations of vegetable
# growers decide each week whether to hold the recommended price or undercut it with their surplus.
# Payoffs, rounds, multipliers, meetings and the unannounced stop are exactly as in the standard game.
# New: a shared buffer. If the five organisations' combined result falls below minus the buffer,
# the sector collapses and the game ends.

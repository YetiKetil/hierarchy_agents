# PROSEDYRE ETTER FASITEN
# Prosedyren skrevet ut slik fasiten (byraakrat.py) løser oppgaven: én plan, alle linjer i bruk
# hver runde, medarbeiderne D, E, F og G ferdige først, og lederne fullfører sine egne sett sist
# og sender kort videre fram til da. Fasiten løser kortutdeling 1 og 2 på 14 og 16 runder.
# Hvor nær kommer agentene?
arver: prosedyre.yaml
tilleggsinstruks:
  overskrift: Slik gjør vi det
  tekst: |
    Gruppen følger denne fremgangsmåten. Det er metoden en algoritme bruker for å løse oppgaven på rundt 15 runder.
    1. Kartlegging. I runde 0 skriver alle til lederen sin hvilke kort de har. B og C sender A en samlet oversikt over sin gren: sine egne kort og kortene til sine to underordnede.
    2. Plan. A bestemmer hvilken verdi hver av de sju skal samle: én verdi per person, alle forskjellige, valgt slik at færrest mulig kort må flyttes. Gi helst hver person en verdi de allerede har flere av, og hold hver verdi i den grenen der de fleste av kortene allerede er. A sender planen til B og C, som straks sender den videre til sine underordnede.
    3. Medarbeiderne blir ferdige først. D, E, F og G fullføres først. Lederne B og C, og til slutt A, fullfører sine egne sett sist. Til alle en leders underordnede har fire like, er lederens egen hånd et gjennomgangssted for andres kort, ikke en samling.
    4. Flytting på alle linjer samtidig. Hver runde sender hver leder en kortforespørsel til hver av sine underordnede når kort kan flyttes: tilby kort som hører hjemme i den underordnedes gren, og be om like mange tilbake. Ikke vent på at ett bytte er ferdig før du starter et nytt på en annen linje.
    5. Svar. Når lederen din ber om kort, sender du tilbake kort som hører hjemme hos noen utenfor din egen gren. For D, E, F og G er det alle kort som ikke er din planlagte verdi. For B og C er det kort som verken hører til deg selv eller dine underordnede.
    6. Videreformidling. En leder tar alltid imot kort som skal til andre, og sender dem videre i neste runde, også når det midlertidig bryter lederens eget sett av fire like.
    7. Status. Etter hvert bytte forteller du lederen din hva du nå har. Hvis ingenting kan flyttes på noen linje, tar en leder imot et kort den ikke trenger, for å få kortene i bevegelse igjen.
    8. Fortsett til alle sju har fire like.
